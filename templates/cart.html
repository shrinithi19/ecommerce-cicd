<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Cart</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="navbar">
        <h1><span class="logo-dot"></span>My Shopping Store</h1>
        <a href="/" class="cart-link">Continue shopping</a>
    </div>

    <div class="cart-wrap">
        <h2>Your cart</h2>
        {% if items %}
            {% for item in items %}
            <div class="cart-item">
                <div class="thumb"><img src="{{ item.image }}" alt="{{ item.name }}"></div>
                <div class="item-info">
                    <h3>{{ item.name }}</h3>
                    <span class="price">${{ item.price }}</span>
                </div>
                <form class="stepper" action="/cart/update/{{ item.id }}" method="POST">
                    <input type="number" name="quantity" value="{{ item.quantity }}" min="0">
                    <button type="submit">Update</button>
                </form>
                <div class="subtotal">${{ "%.2f"|format(item.subtotal) }}</div>
                <form action="/cart/remove/{{ item.id }}" method="POST">
                    <button type="submit" class="remove-btn">Remove</button>
                </form>
            </div>
            {% endfor %}
            <div class="total-box">
                <span>Total</span>
                <strong>${{ "%.2f"|format(total) }}</strong>
            </div>
        {% else %}
            <div class="empty-cart">
                <p>Your cart is empty.</p>
                <a href="/" class="btn" style="text-decoration: none; display: inline-block; margin-top: 12px;">Browse products</a>
            </div>
        {% endif %}
    </div>

    <div class="footer">&copy; 2026 My Shopping Store</div>
</body>
</html>
