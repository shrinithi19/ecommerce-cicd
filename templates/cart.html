<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Your Cart</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Roboto', sans-serif; background-color: #f3f3f3; margin: 0; }
        .navbar { background-color: #131921; color: white; padding: 15px 25px; display: flex; justify-content: space-between; align-items: center; }
        .navbar h1 { margin: 0; font-size: 28px; }
        .navbar a { color: white; text-decoration: none; }
        .container { padding: 40px; max-width: 700px; margin: 0 auto; }
        .cart-item { background: white; border-radius: 8px; padding: 15px 20px; margin-bottom: 15px; display: flex; align-items: center; box-shadow: 0 2px 6px rgba(0,0,0,0.1); }
        .cart-item img { width: 70px; height: 70px; border-radius: 6px; margin-right: 20px; }
        .item-info { flex: 1; }
        .item-info h3 { margin: 0 0 5px 0; }
        .item-price { color: #b12704; font-weight: 500; }
        .qty-form { display: flex; align-items: center; gap: 8px; }
        .qty-form input { width: 50px; padding: 5px; text-align: center; }
        .remove-btn { background: none; border: none; color: #b12704; cursor: pointer; font-size: 14px; margin-left: 15px; }
        .update-btn { padding: 5px 10px; background: #eee; border: 1px solid #ccc; border-radius: 4px; cursor: pointer; }
        .subtotal { min-width: 90px; text-align: right; font-weight: 500; }
        .total-box { background: white; border-radius: 8px; padding: 20px; margin-top: 20px; text-align: right; font-size: 20px; font-weight: 700; box-shadow: 0 2px 6px rgba(0,0,0,0.1); }
        .empty { text-align: center; color: #555; padding: 60px 0; }
        .back-link { display: inline-block; margin-top: 20px; color: #131921; }
    </style>
</head>
<body>
    <div class="navbar">
        <h1>My Shopping Store</h1>
        <a href="/">&larr; Continue Shopping</a>
    </div>
    <div class="container">
        <h2>Your Cart</h2>
        {% if items %}
            {% for item in items %}
            <div class="cart-item">
                <img src="{{ item.image }}" alt="{{ item.name }}">
                <div class="item-info">
                    <h3>{{ item.name }}</h3>
                    <span class="item-price">${{ item.price }}</span>
                </div>
                <form class="qty-form" action="/cart/update/{{ item.id }}" method="POST">
                    <input type="number" name="quantity" value="{{ item.quantity }}" min="0">
                    <button type="submit" class="update-btn">Update</button>
                </form>
                <div class="subtotal">${{ "%.2f"|format(item.subtotal) }}</div>
                <form action="/cart/remove/{{ item.id }}" method="POST">
                    <button type="submit" class="remove-btn">Remove</button>
                </form>
            </div>
            {% endfor %}
            <div class="total-box">
                Total: ${{ "%.2f"|format(total) }}
            </div>
        {% else %}
            <div class="empty">
                <p>Your cart is empty.</p>
                <a href="/" class="back-link">&larr; Go back to shopping</a>
            </div>
        {% endif %}
    </div>
</body>
</html>
