<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ product.name }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="navbar">
        <h1><span class="logo-dot"></span>My Shopping Store</h1>
        <a href="/cart" class="cart-link">Cart</a>
    </div>

    <div class="detail-wrap">
        <div class="detail-image">
            <img src="{{ product.image }}" alt="{{ product.name }}">
        </div>
        <div class="detail-info">
            <div class="eyebrow" style="color: var(--primary); font-weight: 600; font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase;">In stock</div>
            <h2>{{ product.name }}</h2>
            <span class="price">${{ product.price }}</span>
            <div>
                <form action="/cart/add/{{ product.id }}" method="POST" style="display:inline;">
                    <button type="submit" class="btn">Add to cart</button>
                </form>
            </div>
            <a href="/" class="back-link">&larr; Back to store</a>
        </div>
    </div>

    <div class="footer">&copy; 2026 My Shopping Store</div>
</body>
</html>
